<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join Test — MCQ Test Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/student.css" />
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('mcq_theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
</script>
</head>
<body class="student-shell">
  <header class="topbar">
    <div class="container">
      <div class="brand"><span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
      </span> MCQ Test Platform</div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
    </div>
  </header>

  <div class="center-page">
    <!-- Loading state -->
    <div id="loadingState" class="page-loader">
      <span class="spinner"></span> Checking test availability…
    </div>

    <!-- Generic status card (not started / expired / already attempted / not found / inactive) -->
    <div id="statusCard" class="card status-card hidden">
      <div class="status-icon" id="statusIcon"></div>
      <h2 id="statusTitle">—</h2>
      <p id="statusMessage" class="text-muted"></p>
      <div id="statusExtra"></div>
    </div>

    <!-- Entry form -->
    <div id="entryFormWrap" class="card entry-card hidden fade-in">
      <div class="entry-hero">
        <div class="hero-content">
          <div class="entry-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/><path d="m9 9 2 2 4-4"/></svg>
          </div>
          <h1 id="entryTestTitle">Test</h1>
          <p class="hero-sub" id="entryTestDescription"></p>
        </div>
      </div>

      <div class="entry-body">
        <div class="entry-test-info">
          <div class="info-item"><div class="info-label">Questions</div><div class="info-value" id="infoQuestions">—</div></div>
          <div class="info-item"><div class="info-label">Duration</div><div class="info-value" id="infoDuration">—</div></div>
          <div class="info-item"><div class="info-label">Marks Each</div><div class="info-value" id="infoMarks">—</div></div>
        </div>

        <div class="form-error-banner" id="errorBanner"></div>

        <form id="entryForm" novalidate>
          <div class="field">
            <label for="studentName">Full Name *</label>
            <input class="input" type="text" id="studentName" placeholder="Enter your full name" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="collegeName">College Name *</label>
            <select id="collegeName" class="input" required>
              <option value="">-- Select College --</option>
              <option value="LIT, Palanchur">LIT, Palanchur</option>
              <option value="DMICE, Palanchur">DMICE, Palanchur</option>
              <option value="JPCE, Tenkasi">JPCE, Tenkasi</option>
              <option value="SJCE, Nemili">SJCE, Nemili</option>
              <option value="DMIEC, Aral">DMIEC, Aral</option>
              <option value="SJCET, Thanjavur">SJCET, Thanjavur</option>
              <option value="CTKEC, Coimbatore">CTKEC, Coimbatore</option>
              <option value="SJCK,Kovur">SJCK,Kovur</option>
              <option value="JPCAS,Tenkasi">JPCAS,Tenkasi</option>
              <option value="DMI Edu, Palanchur">DMI Edu, Palanchur</option>
              <option value="ANGELCE, Rajapalayam">ANGELCE, Rajapalayam</option>
              <option value="JP Edu, Tenkasi">JP Edu, Tenkasi</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="designation">Designation *</label>
            <select id="designation" class="input" required>
              <option value="">-- Select Designation --</option>
              <option value="Accountant Staff">Accountant Staff </option>
              <option value="Accountant Sister">Accountant Sister </option>
            </select>
          </div>

          <div class="entry-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
            <span>You can attempt this test <strong>only once</strong>. Once you start, a countdown timer will begin and the test will auto-submit when time runs out.</span>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" style="margin-top: var(--space-5);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>
            <span id="submitLabel">Start Test</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="/js/student/entry.js"></script>
</body>
</html>
