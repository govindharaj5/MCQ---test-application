<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — MCQ Test Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/admin.css" />
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('mcq_theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
</script>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand"><span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
      </span> Online Test Platform</div>
      <div class="flex items-center gap-3">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Log Out
        </button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">
      <div class="page-heading">
        <div>
          <h1>Dashboard</h1>
          <p class="subtitle">Overview across all your tests.</p>
        </div>
        <a href="/admin/test-form.html" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Create New Test
        </a>
      </div>

      <div class="stat-grid" id="overviewStats">
        <!-- populated by JS -->
      </div>

      <div class="section-title-row" style="margin-top: var(--space-7);">
        <h2 style="margin:0;">Your Tests</h2>
      </div>

      <div id="testListContainer">
        <div class="page-loader"><span class="spinner"></span> Loading tests…</div>
      </div>
    </div>
  </main>

  <!-- Delete confirmation modal -->
  <div class="modal-overlay hidden" id="deleteModal">
    <div class="modal">
      <h3>Delete this test?</h3>
      <p>This will permanently delete the test, all its questions, and every student's results. This cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">Delete Test</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/admin/dashboard.js"></script>
</body>
</html>
