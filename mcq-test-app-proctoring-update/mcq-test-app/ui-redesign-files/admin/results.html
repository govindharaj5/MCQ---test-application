<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Results — MCQ Test Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/admin.css" />
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('mcq_theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
</script>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand"><span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
      </span> Online Test Platform</div>
      <div class="flex items-center gap-3">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Log Out
        </button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">
      <div class="breadcrumb"><a href="/admin/dashboard.html">Dashboard</a> / <span>Results</span></div>
      <div class="page-heading">
        <div>
          <h1 id="testTitleHeading">Results</h1>
          <p class="subtitle" id="testSubtitle"></p>
        </div>
        <a href="#" id="questionsLink" class="btn btn-secondary">Manage Questions</a>
      </div>

      <div class="stat-grid" id="statsGrid">
        <div class="page-loader"><span class="spinner"></span> Loading stats…</div>
      </div>

      <!-- Question-level analytics -->
      <div class="card hidden" id="analyticsCard" style="margin-top: var(--space-6);">
        <h3 style="margin:0 0 var(--space-4);">Question Analytics</h3>
        <div class="flex gap-4 flex-wrap" id="analyticsExtremes" style="margin-bottom: var(--space-5);"></div>
        <div class="table-wrap">
          <table class="data-table" id="analyticsTable">
            <thead>
              <tr><th>#</th><th>Question</th><th>Correct</th><th>Wrong</th><th>Accuracy</th></tr>
            </thead>
            <tbody id="analyticsBody"></tbody>
          </table>
        </div>
      </div>

      <div class="results-toolbar" style="margin-top: var(--space-7);">
        <div class="filters">
          <div class="search-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="input" type="text" id="searchInput" placeholder="Search by name, register number, or mobile…" />
          </div>
          <select class="input" id="statusFilter" style="max-width: 180px;">
            <option value="">All statuses</option>
            <option value="completed">Completed</option>
            <option value="in_progress">In Progress</option>
            <option value="auto_submitted">Auto Submitted</option>
            <option value="cheating_detected">Cheating Detected</option>
          </select>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-secondary btn-sm" id="exportCsvBtn">Export CSV</button>
          <button class="btn btn-secondary btn-sm" id="exportXlsxBtn">Export Excel</button>
          <button class="btn btn-secondary btn-sm" id="exportPdfBtn">Export PDF</button>
        </div>
      </div>

      <div id="resultsTableContainer">
        <div class="page-loader"><span class="spinner"></span> Loading results…</div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/admin/results.js"></script>
</body>
</html>
