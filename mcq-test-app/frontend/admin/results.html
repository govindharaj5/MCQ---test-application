<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Results — MCQ Test Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/admin.css" />
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('mcq_theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
</script>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand"><span class="brand-mark">JS</span> Online Test Platform</div>
      <div class="flex items-center gap-3">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"></button>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Log Out</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">
      <div class="breadcrumb"><a href="/admin/dashboard.html">Dashboard</a> / <span>Results</span></div>
      <div class="page-heading">
        <div>
          <h1 id="testTitleHeading">Results</h1>
          <p class="subtitle" id="testSubtitle"></p>
        </div>
        <a href="#" id="questionsLink" class="btn btn-secondary">Manage Questions</a>
      </div>

      <div class="stat-grid" id="statsGrid">
        <div class="page-loader"><span class="spinner"></span> Loading stats…</div>
      </div>

      <div class="results-toolbar" style="margin-top: var(--space-7);">
        <div class="filters">
          <div class="search-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="input" type="text" id="searchInput" placeholder="Search by name, register number, or mobile…" />
          </div>
          <select class="input" id="statusFilter" style="max-width: 180px;">
            <option value="">All statuses</option>
            <option value="completed">Completed</option>
            <option value="in_progress">In Progress</option>
          </select>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-secondary btn-sm" id="exportCsvBtn">Export CSV</button>
          <button class="btn btn-secondary btn-sm" id="exportXlsxBtn">Export Excel</button>
        </div>
      </div>

      <div id="resultsTableContainer">
        <div class="page-loader"><span class="spinner"></span> Loading results…</div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/admin/results.js"></script>
</body>
</html>
